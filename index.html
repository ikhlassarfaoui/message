<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9ec4, #ff3b7a);
            font-family: Arial, sans-serif;
            color: white;
        }

        .container {
            background: rgba(255,255,255,0.15);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        #message {
            font-size: 1.4rem;
            line-height: 1.6;
            white-space: pre-line;
            min-height: 100px;
        }

        button {
            margin-top: 20px;
            padding: 10px 25px;
            font-size: 1rem;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background: white;
            color: #ff3b7a;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <p id="message"></p>
    <button onclick="startMessage()">Afficher le message</button>
</div>

<script>
    const text = "إذا لم تجمعنا الأيام جمعتنا الذكريات و إذا القلب لم يراك فالعين لن تنساك\nتوحشتك برشا يا رومانية";
    let index = 0;
    const speed = 45;

    function startMessage() {
        index = 0;
        document.getElementById("message").innerHTML = "";
        typeWriter();
    }

    function typeWriter() {
        if (index < text.length) {
            document.getElementById("message").innerHTML += text.charAt(index);
            index++;
            setTimeout(typeWriter, speed);
        }
    }
</script>

</body>
</html>
