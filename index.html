<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Déclaration d'amour ✨</title>

    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at top, #ff9ec4, #ff6b9d, #ff3b7a);
            font-family: "Poppins", sans-serif;
            color: white;
        }

        /* Effet de brillance animée */
        .shine {
            position: absolute;
            width: 200%;
            height: 200%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,0.25), transparent);
            animation: shine 6s infinite;
            pointer-events: none;
        }

        @keyframes shine {
            0% { transform: translate(-50%, -50%) rotate(25deg); }
            100% { transform: translate(50%, 50%) rotate(25deg); }
        }

        .container {
            background: rgba(255, 255, 255, 0.12);
            padding: 40px 35px;
            border-radius: 25px;
            backdrop-filter: blur(15px);
            box-shadow: 0 0 20px rgba(0,0,0,0.25);
            text-align: center;
            max-width: 650px;
            z-index: 10;
        }

        h1 {
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        #message {
            font-size: 1.4rem;
            line-height: 1.6;
            min-height: 120px;
            white-space: pre-line;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            font-size: 1.1rem;
            border: none;
            border-radius: 25px;
            background: white;
            color: #ff2975;
            cursor: pointer;
            font-weight: 600;
            transition: 0.3s;
        }

        button:hover {
            background: #ffe5ef;
        }

        /* Cœurs flottants */
        .heart {
            position: fixed;
            color: rgba(255,255,255,0.85);
            font-size: 22px;
            animation: floatUp 4s linear forwards;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-200px) scale(1.5); opacity: 0; }
        }
    </style>
</head>
<body>

<div class="shine"></div>

<div class="container">
    <h1>💖 Une petite surprise pour toi 💖</h1>

    <p id="message"></p>

    <button onclick="startMessage()">Afficher le message</button>
</div>

<audio id="musique" src="ca.aac" autoplay></audio>

<script>
    const text = 
`Depuis que tu es entré(e) dans ma vie, 
tout est devenu plus doux, plus beau, plus lumineux.

Je t’aime, tout simplement. 💕`;

    let index = 0;
    const speed = 45; // vitesse d’écriture

    function startMessage() {
        // Lance la musique
        document.getElementById("musique").play();

        // Empêche de lancer deux fois l’animation
        index = 0;
        document.getElementById("message").innerHTML = "";

        typeWriter();
        setInterval(createHeart, 300);
    }

    // Effet machine à écrire
    function typeWriter() {
        if (index < text.length) {
            document.getElementById("message").innerHTML += text.charAt(index);
            index++;
            setTimeout(typeWriter, speed);
        }
    }

    // Cœurs flottants
    function createHeart() {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        heart.innerHTML = "❤️";
        heart.style.left = Math.random() * window.innerWidth + "px";
        heart.style.bottom = "0px";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 4000);
    }
</script>

</body>
</html>
